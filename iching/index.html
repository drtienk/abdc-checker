<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>序卦傳・六十四卦閃卡</title><style>body{font-family:-apple-system,"PingFang TC",sans-serif;background:#f7f5ef;margin:0;text-align:center;color:#171717}.wrap{max-width:600px;margin:auto;padding:18px}.hex{font-family:"Apple Symbols","Segoe UI Symbol",serif;font-size:128px;line-height:1;color:#0B4F2C;margin:30px 0 10px}.name{font-size:44px;font-weight:800}.q{font-size:28px;font-weight:700;margin:35px 0}.answer{display:none;border:1px solid #ccc;border-radius:18px;background:#fff;padding:20px}.answer.show{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ahex{font-family:"Apple Symbols","Segoe UI Symbol",serif;font-size:128px;line-height:1;color:#0B4F2C}.aname{font-size:30px;font-weight:800}button{font-size:20px;font-weight:700;padding:15px 20px;border-radius:14px;border:1px solid #aaa;background:#fff;margin:8px}.primary{background:#111;color:#fff}.nav{display:flex;justify-content:center;gap:8px;margin-top:16px}</style></head><body><div class="wrap"><div id="count"></div><div id="hex" class="hex"></div><div id="name" class="name"></div><div class="q">前一卦？　後一卦？</div><button onclick="showAnswer()">顯示答案</button><div id="answer" class="answer"><div><div>前一卦</div><div id="phex" class="ahex"></div><div id="pname" class="aname"></div></div><div><div>後一卦</div><div id="nhex" class="ahex"></div><div id="nname" class="aname"></div></div></div><div class="nav"><button onclick="prev()">← 上一題</button><button class="primary" onclick="next()">下一題 →</button></div><button onclick="start()">重新隨機開始</button></div><script>const names=['乾','坤','屯','蒙','需','訟','師','比','小畜','履','泰','否','同人','大有','謙','豫','隨','蠱','臨','觀','噬嗑','賁','剝','復','無妄','大畜','頤','大過','坎','離','咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解','損','益','夬','姤','萃','升','困','井','革','鼎','震','艮','漸','歸妹','豐','旅','巽','兌','渙','節','中孚','小過','既濟','未濟'];const syms=Array.from({length:64},(_,i)=>String.fromCodePoint(0x4DC0+i));let deck=[],pos=0;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){deck=shuffle([...Array(64).keys()]);pos=0;render()}function render(){const i=deck[pos],p=(i+63)%64,n=(i+1)%64;count.textContent=`第 ${pos+1} / 64 題`;hex.textContent=syms[i];name.textContent=names[i];phex.textContent=syms[p];pname.textContent=names[p];nhex.textContent=syms[n];nname.textContent=names[n];answer.classList.remove('show')}function showAnswer(){answer.classList.toggle('show')}function next(){pos=(pos+1)%64;render()}function prev(){pos=(pos+63)%64;render()}start();</script></body></html>
